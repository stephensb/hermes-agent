; Asterisk ARI configuration for the Hermes SIP voice bridge.
;
; Copy the relevant stanzas into /etc/asterisk/ari.conf (and reload with
; `asterisk -rx "module reload res_ari.so"`).  The username/password here must
; match SIP_ARI_USER / SIP_ARI_PASSWORD in the Hermes gateway environment.

[general]
enabled = yes
pretty = yes
allowed_origins = *

[hermes]                  ; <-- SIP_ARI_USER
type = user
read_only = no
password = change-me      ; <-- SIP_ARI_PASSWORD (use a strong secret)
