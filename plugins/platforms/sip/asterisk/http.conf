; Asterisk built-in HTTP server — required for ARI (the Hermes SIP bridge
; talks to Asterisk over ARI at http://<asterisk>:8088/ari).
;
; Merge into /etc/asterisk/http.conf and reload:
;   asterisk -rx "module reload res_http_websocket.so"
;   asterisk -rx "module reload res_ari.so"

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
