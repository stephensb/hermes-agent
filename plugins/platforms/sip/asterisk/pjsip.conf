; Asterisk PJSIP configuration for the Hermes SIP voice bridge.
;
; Registers the OBi200 (or any SIP ATA / softphone) as an endpoint that can
; dial into Asterisk.  Append to /etc/asterisk/pjsip.conf and reload with
; `asterisk -rx "module reload res_pjsip.so"`.
;
; The OBi200's "ITSP Profile" / "Voice Service" SP must point its SIP proxy at
; this Asterisk host and authenticate with the username/password below.  See
; README.md for the OBi200 side.

; --- UDP transport ----------------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; --- OBi200 endpoint --------------------------------------------------------
[obi200]
type = endpoint
context = hermes-inbound          ; dialplan context (see extensions.conf)
disallow = all
allow = ulaw                      ; G.711 µ-law — universally supported by OBi200
allow = alaw
auth = obi200-auth
aors = obi200
direct_media = no                 ; keep media through Asterisk so externalMedia can tap it

[obi200-auth]
type = auth
auth_type = userpass
username = obi200
password = change-me              ; set the same secret on the OBi200 SP

[obi200]
type = aor
max_contacts = 1
remove_existing = yes
