; Asterisk dialplan for the Hermes SIP voice bridge.
;
; Append to /etc/asterisk/extensions.conf and reload with
; `asterisk -rx "dialplan reload"`.
;
; Any call the OBi200 places (it auto-dials a single target when the handset is
; lifted — see README.md) lands in the `hermes-inbound` context and is handed
; straight to the Stasis application named `hermes`.  That name must match
; SIP_STASIS_APP in the Hermes gateway environment (default: hermes).
;
; The adapter answers the channel, attaches an externalMedia (AudioSocket) leg,
; and bridges them — so no Answer()/Playback() is needed here.

[hermes-inbound]
; Match the OBi200 auto-dial target.  Default OBi200 off-hook auto-dial sends
; the digits you configure; `s` covers the "no digits / immediate" case, and
; the `_X.` pattern covers any dialed number so configuration is forgiving.
exten => s,1,NoOp(Hermes: inbound call from ${CALLERID(num)})
 same => n,Stasis(hermes)
 same => n,Hangup()

exten => _X.,1,NoOp(Hermes: inbound call to ${EXTEN} from ${CALLERID(num)})
 same => n,Stasis(hermes)
 same => n,Hangup()
